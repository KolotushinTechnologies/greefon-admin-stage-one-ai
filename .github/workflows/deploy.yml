name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP=/var/www/greefon-admin-stage-one-ai
            if [ ! -d "$APP/.git" ]; then
              echo "Repo missing at $APP — clone once manually first."
              exit 1
            fi
            cd "$APP"
            # deploy.sh приезжает с новым коммитом; до pull используем inline-логику
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            APP_DIR="$APP" COMPOSE_FILE=docker-compose.prod.yml ./scripts/deploy.sh
