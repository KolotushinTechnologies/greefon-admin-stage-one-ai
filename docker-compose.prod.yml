services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: greefon
      RABBITMQ_DEFAULT_PASS: greefon
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    command: ["node", "dist/app/api.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://greefon:greefon@rabbitmq:5672
    ports:
      - "127.0.0.1:3890:3890"
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "dist/app/worker.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://greefon:greefon@rabbitmq:5672
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  redis_data:
  rabbitmq_data:
